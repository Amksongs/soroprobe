# Release builds, run by .github/workflows/release.yml when a v* tag is pushed.
# Check locally with: goreleaser release --snapshot --clean
version: 2

project_name: soroprobe

before:
  hooks:
    - go mod tidy

builds:
  - id: soroprobe
    main: ./cmd/soroprobe
    binary: soroprobe
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/man/soroprobe.1

sbom:
  - artifacts: binary
    format: spdx-json
    name_template: "{{ .BinaryName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.spdx.json"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))?!!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
