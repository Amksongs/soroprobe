name: Auto-merge

# Merges pull requests once their CI has passed. The rules live in
# .github/scripts/automerge.sh, which always runs from the default branch:
# workflow_run and schedule never use a pull request's copy of this file or
# the script, so a PR cannot change the rules that judge it.

on:
  workflow_run:
    workflows: [CI, Security, Malware scan]
    types: [completed]
  # Catches PRs whose last check finished while another merge was running.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be merged, without merging"
        type: boolean
        default: true

# .github/scripts/automerge.sh needs write on the PR itself, the issues it
# closes and the labels/comments it leaves, plus the ability to re-run CI.
permissions:
  contents: write
  pull-requests: write
  issues: write
  # Reading check results to decide whether a PR may merge.
  checks: read
  # Re-running CI on main after a merge (GITHUB_TOKEN pushes do not trigger it).
  actions: write

# One merge at a time: each merge moves main and invalidates other PRs' checks.
concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Merge passing pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: "build govulncheck malware-scan"
          PROTECTED_PATHS: ".github/ .goreleaser.yaml Dockerfile"
          CI_WORKFLOW: "ci.yml"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: bash .github/scripts/automerge.sh
