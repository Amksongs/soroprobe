name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published independently of our commits, so scan weekly
  # even when nothing has been pushed.
  schedule:
    - cron: "17 6 * * 1"

# govulncheck only reads the code it analyses.
permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # Fails only on vulnerabilities the code can actually reach, so an
      # advisory in an unused corner of a dependency does not block a PR.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
